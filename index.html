<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>河南有膜有样 · 产品图册</title>
<style>
  :root {
    --bg: #F6F8FC;
    --surface: #FFFFFF;
    --border: #D9DEE7;
    --text: #1A1F2E;
    --text-secondary: #3D4A5C;
    --text-muted: #6B7689;
    --primary: #0969DA;
    --primary-soft: #EAF2FC;
    --primary-strong: #0855B8;
    --success: #1A7F37;
    --success-soft: #E6F4EA;
    --warning: #BF6900;
    --warning-soft: #FFF4E5;
    --danger: #D1242A;
    --danger-soft: #FCE8E9;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== Header ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: linear-gradient(135deg, #0969DA 0%, #0855B8 100%);
    color: #fff;
    padding: 12px 16px 10px;
    box-shadow: 0 2px 12px rgba(9,105,218,0.2);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .header-brand {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.7;
  }
  .header-title {
    font-size: 17px;
    font-weight: 700;
  }
  .header-count {
    font-size: 11px;
    opacity: 0.6;
    text-align: right;
  }

  /* Search */
  .search-bar {
    position: relative;
    margin-bottom: 8px;
  }
  .search-input {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border: none;
    border-radius: 18px;
    font-size: 13px;
    background: rgba(255,255,255,0.95);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    opacity: 0.4;
  }

  /* Category Switch */
  .category-bar {
    display: flex;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .category-tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
    background: var(--surface);
  }
  .category-tab .cat-icon { font-size: 16px; display: block; margin-bottom: 2px; }
  .category-tab .cat-count { font-size: 10px; opacity: 0.6; }
  .category-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: var(--primary-soft);
  }

  /* Brand Tabs */
  .brand-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin-bottom: 6px;
  }
  .brand-tabs::-webkit-scrollbar { display: none; }
  .brand-tab {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 500;
    background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.9);
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .brand-tab.active {
    background: #fff;
    color: var(--primary);
    border-color: #fff;
    font-weight: 600;
  }
  .brand-tab .count {
    font-size: 10px;
    opacity: 0.7;
    margin-left: 2px;
  }

  /* Series Filter */
  .series-filter {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .series-filter::-webkit-scrollbar { display: none; }
  .series-tab {
    flex-shrink: 0;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .series-tab.active {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary);
    font-weight: 600;
  }

  /* Status Filter */
  .status-filter {
    display: flex;
    gap: 6px;
    padding: 6px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .status-filter::-webkit-scrollbar { display: none; }
  .status-tab {
    flex-shrink: 0;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .status-tab.active {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary);
    font-weight: 600;
  }
  .status-tab.featured.active {
    background: linear-gradient(135deg, #FF6B6B, #FF4757);
    color: #fff;
    border-color: #FF4757;
  }
  .status-tab .update-badge {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 5px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: 700;
    background: linear-gradient(135deg, #FF6B6B, #FF4757);
    color: #fff;
    vertical-align: middle;
    animation: badgePulse 1.5s ease-in-out infinite;
    line-height: 1.4;
  }
  @keyframes badgePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.85; }
  }
  .status-tab.active .update-badge {
    animation: none;
  }

  /* Price Filter */
  .price-filter {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .price-filter::-webkit-scrollbar { display: none; }
  .price-label {
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
    font-weight: 600;
  }
  .price-tab {
    flex-shrink: 0;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .price-tab.active {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary);
    font-weight: 600;
  }

  /* ===== Product Grid ===== */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 8px 8px 24px;
  }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
  }
  .product-card:active { transform: scale(0.98); }

  .card-img {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #f0f2f5 0%, #e5e8ed 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-img .placeholder-icon {
    font-size: 32px;
    opacity: 0.5;
    margin-bottom: 4px;
  }
  .card-img .placeholder-text {
    font-size: 10px;
    color: var(--text-muted);
    opacity: 0.6;
  }
  .card-img .series-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    padding: 2px 7px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    background: rgba(255,255,255,0.9);
    color: var(--text-secondary);
    backdrop-filter: blur(4px);
  }
  .card-img .type-tag {
    position: absolute;
    top: 6px;
    right: 6px;
    padding: 2px 7px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    backdrop-filter: blur(4px);
  }
  .type-tag.self {
    background: rgba(9,105,218,0.85);
    color: #fff;
  }
  .type-tag.channel {
    background: rgba(107,118,137,0.85);
    color: #fff;
  }
  .card-img .featured-tag {
    position: absolute;
    bottom: 6px;
    right: 6px;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    background: linear-gradient(135deg, #FF6B6B, #FF4757);
    color: #fff;
    z-index: 2;
  }
  .card-img .new-tag {
    position: absolute;
    top: 6px;
    left: 6px;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    background: linear-gradient(135deg, #2ED573, #1E90FF);
    color: #fff;
    z-index: 2;
  }
  .card-img .heart-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    z-index: 3;
    transition: all 0.2s ease;
    border: none;
    padding: 0;
  }
  .card-img .heart-btn:active {
    transform: scale(0.9);
  }
  .card-img .heart-btn.liked {
    background: linear-gradient(135deg, #FF6B6B, #FF4757);
  }
  .card-img .heart-btn.liked .heart-icon {
    color: #fff;
  }
  .heart-icon {
    color: #FF6B6B;
    transition: all 0.2s ease;
    line-height: 1;
  }
  .card-img .heart-count {
    position: absolute;
    bottom: 6px;
    left: 6px;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    background: rgba(255,107,107,0.85);
    color: #fff;
    backdrop-filter: blur(4px);
    z-index: 2;
    pointer-events: none;
  }

  .card-body {
    padding: 6px 8px 8px;
  }
  .card-sku {
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    font-family: "SF Mono", Monaco, monospace;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-price {
    font-size: 15px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 2px;
  }
  .card-price .currency {
    font-size: 10px;
    font-weight: 500;
    margin-right: 1px;
  }
  .card-model {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-subcat {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .card-launch {
    font-size: 10px;
    font-weight: 600;
    color: #1E90FF;
    margin-bottom: 4px;
  }
  .card-colors {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-wrap: wrap;
  }
  .color-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid #ddd;
    flex-shrink: 0;
  }
  .card-sellpoint {
    font-size: 10px;
    color: var(--text-secondary);
    background: var(--primary-soft);
    border-radius: 4px;
    padding: 3px 5px;
    line-height: 1.4;
    margin-top: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== Load More ===== */
  .load-more {
    text-align: center;
    padding: 16px;
    color: var(--text-muted);
    font-size: 12px;
  }
  .load-more .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 6px;
    vertical-align: middle;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== No Results ===== */
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
    display: none;
  }
  .no-results .icon { font-size: 40px; margin-bottom: 8px; }

  /* ===== Detail Modal ===== */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    display: none;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .modal-overlay.show {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 1;
  }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 92vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-handle {
    width: 36px;
    height: 4px;
    background: #D9DEE7;
    border-radius: 2px;
    margin: 8px auto;
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 28px;
    height: 28px;
    background: rgba(0,0,0,0.05);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text-muted);
    cursor: pointer;
    z-index: 1;
  }
  .modal-img {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #f0f2f5 0%, #e5e8ed 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-img .placeholder-icon {
    font-size: 60px;
    opacity: 0.4;
    margin-bottom: 8px;
  }
  .modal-img .placeholder-text {
    font-size: 14px;
    color: var(--text-muted);
    opacity: 0.6;
  }
  .modal-tags {
    position: absolute;
    top: 50px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
  }
  .modal-featured {
    position: absolute;
    bottom: 12px;
    right: 12px;
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: linear-gradient(135deg, #FF6B6B, #FF4757);
    color: #fff;
    z-index: 2;
  }
  .modal-new {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: linear-gradient(135deg, #2ED573, #1E90FF);
    color: #fff;
    z-index: 2;
  }
  .modal-heart-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    z-index: 3;
    transition: all 0.2s ease;
    border: none;
    padding: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .modal-heart-btn:active {
    transform: scale(0.9);
  }
  .modal-heart-btn.liked {
    background: linear-gradient(135deg, #FF6B6B, #FF4757);
  }
  .modal-heart-btn.liked .heart-icon {
    color: #fff;
  }
  .modal-heart-info {
    position: absolute;
    bottom: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,107,107,0.9);
    color: #fff;
    backdrop-filter: blur(4px);
    z-index: 2;
  }
  .modal-body { padding: 14px 16px 32px; }
  .modal-sku {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    font-family: "SF Mono", Monaco, monospace;
    margin-bottom: 2px;
  }
  .modal-name {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    line-height: 1.5;
  }
  .modal-price {
    font-size: 26px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 10px;
  }
  .modal-price .currency {
    font-size: 14px;
    font-weight: 500;
    margin-right: 2px;
  }
  .modal-info {
    border-top: 1px solid var(--border);
    padding-top: 6px;
  }
  .modal-info-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid #F0F2F5;
    font-size: 13px;
  }
  .modal-info-row:last-child { border-bottom: none; }
  .modal-info-label {
    flex-shrink: 0;
    width: 68px;
    color: var(--text-muted);
    font-size: 12px;
    line-height: 1.7;
  }
  .modal-info-value {
    flex: 1;
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.7;
  }
  .modal-info-value strong { color: var(--text); font-weight: 600; }
  .modal-colors {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .modal-colors .color-item {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
  }
  .modal-sellpoint {
    background: var(--primary-soft);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-top: 10px;
    border-left: 3px solid var(--primary);
  }
  .modal-sellpoint .label {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .modal-sellpoint .text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .modal-display {
    background: var(--warning-soft);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    margin-top: 8px;
    border-left: 3px solid var(--warning);
  }
  .modal-display .label {
    font-size: 11px;
    color: var(--warning);
    font-weight: 600;
    margin-bottom: 2px;
  }
  .modal-display .text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* ===== Match Badge (card) ===== */
  .card-img .match-tag {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 600;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    backdrop-filter: blur(4px);
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 3px;
    pointer-events: none;
    white-space: nowrap;
  }

  /* ===== Match Section (modal) ===== */
  .modal-match {
    margin-top: 14px;
    padding: 14px;
    background: linear-gradient(135deg, #f5f0ff 0%, #ede5ff 100%);
    border-radius: var(--radius-md);
    border: 1px solid rgba(118,75,162,0.15);
  }
  .modal-match-title {
    font-size: 13px;
    font-weight: 700;
    color: #6B4FBB;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .modal-match-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1px solid rgba(118,75,162,0.1);
  }
  .modal-match-card:active { transform: scale(0.98); }
  .modal-match-thumb {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #f0f2f5 0%, #e5e8ed 100%);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-match-thumb img {
    width: 100%;
    height: 100%;

const HEART_STORAGE_KEY = 'product_catalog_hearts';

function getHeartData() {
  try {
    const data = localStorage.getItem(HEART_STORAGE_KEY);
    return data ? JSON.parse(data) : {};
  } catch (e) {
    return {};
  }
}

function saveHeartData(data) {
  try {
    localStorage.setItem(HEART_STORAGE_KEY, JSON.stringify(data));
  } catch (e) {}
}

function isLiked(sku) {
  const data = getHeartData();
  return !!data[sku];
}

  // Local count: 1 if liked, 0 if not

  const data = getHeartData();
  return data[sku] ? 1 : 0;
}

function toggleHeart(sku) {
  const data = getHeartData();
  if (data[sku]) {
    delete data[sku];
  } else {
    data[sku] = Date.now();
  }
  saveHeartData(data);
  return !data[sku] ? false : true;
}

function getTotalLikedCount() {
  const data = getHeartData();
  return Object.keys(data).length;
}

// ===== Update Badge System =====
const UPDATE_BADGE_KEY = 'product_catalog_update_badges';

function getLastSeenCounts() {
  try {
    const data = localStorage.getItem(UPDATE_BADGE_KEY);
    return data ? JSON.parse(data) : {};
  } catch (e) {
    return {};
  }
}

function saveLastSeenCounts(counts) {
  try {
    localStorage.setItem(UPDATE_BADGE_KEY, JSON.stringify(counts));
  } catch (e) {}
}

function hasUpdates(statusKey, currentCount) {
  const lastCounts = getLastSeenCounts();
  const lastCount = lastCounts[statusKey] || 0;
  return currentCount > lastCount;
}

function markStatusAsSeen(statusKey, currentCount) {
  const lastCounts = getLastSeenCounts();
  lastCounts[statusKey] = currentCount;
  saveLastSeenCounts(lastCounts);
}

let allProducts = [];
let filteredProducts = [];
let displayedCount = 0;
const PAGE_SIZE = 40;

let currentCategory = '手机壳';
let currentBrand = 'all';
let currentSeries = 'all';
let currentStatus = 'all';
let currentPrice = 'all';
let currentSearch = '';

let isLoading = false;

// ===== Init =====
async function init() {
  try {
    const res = await fetch('products.json');
    allProducts = await res.json();
  } catch (e) {
    console.warn('fetch products.json 失败，使用内嵌数据', e);
    allProducts = typeof PRODUCTS_DATA !== 'undefined' ? PRODUCTS_DATA : [];
  }
  
  // Initialize update badge baseline on first visit
  initUpdateBadges();
  
  renderBrandTabs();
  updateStatusCounts();
  renderSeriesFilter();
  updateHeaderCount();
  updateCategoryCounts();
  applyFilters();
  setupInfiniteScroll();
  setupPriceFilter();
  setupCategorySwitch();
}

function initUpdateBadges() {
  const lastCounts = getLastSeenCounts();
  // If no data stored yet, initialize with current counts (first visit = no NEW)
  if (Object.keys(lastCounts).length === 0) {
    const cats = ['手机壳', '手机支架', '手机挂链'];
    const initialCounts = {};
    cats.forEach(cat => {
      const catProducts = allProducts.filter(p => p.category === cat);
      initialCounts[cat + ':all'] = catProducts.length;
      initialCounts[cat + ':featured'] = catProducts.filter(p => p.featured).length;
      initialCounts[cat + ':新品'] = catProducts.filter(p => p.isNew).length;
      initialCounts[cat + ':预售'] = catProducts.filter(p => p.status === '预售').length;
      initialCounts[cat + ':在售'] = catProducts.filter(p => p.status === '在售').length;
      initialCounts[cat + ':清仓'] = catProducts.filter(p => p.status === '清仓').length;
    });
    // 全局新品计数（跨品类）
    initialCounts['all:新品'] = allProducts.filter(p => p.isNew).length;
    saveLastSeenCounts(initialCounts);
  }
}

// ===== Render Brand Tabs =====
function renderBrandTabs() {
  const brands = {};
  allProducts.forEach(p => {
    // 新品状态下跨品类统计品牌，其他状态按当前品类
    if (currentStatus !== '新品' && p.category !== currentCategory) return;
    brands[p.phoneBrand] = (brands[p.phoneBrand] || 0) + 1;
  });
  
  const sortedBrands = Object.entries(brands).sort((a, b) => b[1] - a[1]);
  const totalCount = currentStatus === '新品'
    ? allProducts.filter(p => p.isNew).length
    : allProducts.filter(p => p.category === currentCategory).length;
  
  let html = `<div class="brand-tab active" data-brand="all">全部 <span class="count">${totalCount}</span></div>`;
  sortedBrands.forEach(([brand, count]) => {
    html += `<div class="brand-tab" data-brand="${brand}">${brand} <span class="count">${count}</span></div>`;
  });
  
  document.getElementById('brandTabs').innerHTML = html;
  
  document.getElementById('brandTabs').addEventListener('click', function(e) {
    let tab = e.target.closest('.brand-tab');
    if (!tab) return;
    document.querySelectorAll('.brand-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentBrand = tab.dataset.brand;
    renderSeriesFilter();
    applyFilters();
  });
}

// ===== Render Series Filter =====
function renderSeriesFilter() {
  const series = {};
  allProducts.forEach(p => {
    if (currentStatus !== '新品' && p.category !== currentCategory) return;
    if (p.series && (currentBrand === 'all' || p.phoneBrand === currentBrand)) {
      series[p.series] = (series[p.series] || 0) + 1;
    }
  });
  
  const sortedSeries = Object.entries(series).sort((a, b) => b[1] - a[1]);
  
  let html = `<div class="series-tab active" data-series="all">全部系列</div>`;
  sortedSeries.forEach(([s, count]) => {
    html += `<div class="series-tab" data-series="${s}">${s} (${count})</div>`;
  });
  
  document.getElementById('seriesFilter').innerHTML = html;
  currentSeries = 'all';
  
  document.getElementById('seriesFilter').onclick = function(e) {
    let tab = e.target.closest('.series-tab');
    if (!tab) return;
    document.querySelectorAll('.series-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentSeries = tab.dataset.series;
    applyFilters();
  };
}

// ===== Apply Filters =====
function applyFilters() {
  filteredProducts = allProducts.filter(p => {
    // 新品状态下跨品类显示全部新品，其他状态按当前品类筛选
    let categoryMatch = currentStatus === '新品' ? true : p.category === currentCategory;
    let brandMatch = currentBrand === 'all' || p.phoneBrand === currentBrand;
    let seriesMatch = currentSeries === 'all' || p.series === currentSeries;
    let statusMatch = currentStatus === 'all' ||
      (currentStatus === 'featured' ? p.featured :
       currentStatus === '新品' ? p.isNew : p.status === currentStatus);
    let searchMatch = currentSearch === '' ||
      p.sku.toLowerCase().includes(currentSearch.toLowerCase()) ||
      p.model.toLowerCase().includes(currentSearch.toLowerCase()) ||
      p.series.toLowerCase().includes(currentSearch.toLowerCase()) ||
      p.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
      p.subCategory.toLowerCase().includes(currentSearch.toLowerCase());
    let priceMatch = currentPrice === 'all';
    if (!priceMatch) {
      const price = p.price;
      const knownPrices = ['39','59','79','89','99','129','169','199'];
      if (currentPrice === 'other') {
        priceMatch = !knownPrices.includes(price);
      } else {
        priceMatch = price === currentPrice;
      }
    }
    return categoryMatch && brandMatch && seriesMatch && statusMatch && priceMatch && searchMatch;
  });

  if (currentStatus === '新品') {
    filteredProducts.sort((a, b) => (b.launchDate || '').localeCompare(a.launchDate || ''));
  }

  displayedCount = 0;
  document.getElementById('productGrid').innerHTML = '';
  document.getElementById('noResults').style.display = filteredProducts.length === 0 ? 'block' : 'none';
  
  updateHeaderCount();
  loadMore();
}

// ===== Load More =====
function loadMore() {
  if (isLoading) return;
  if (displayedCount >= filteredProducts.length) return;
  
  isLoading = true;
  document.getElementById('loadMore').style.display = 'block';
  
  setTimeout(() => {
    const grid = document.getElementById('productGrid');
    const end = Math.min(displayedCount + PAGE_SIZE, filteredProducts.length);
    const batch = filteredProducts.slice(displayedCount, end);
    
    batch.forEach(p => {
      grid.appendChild(createCard(p));
    });
    
    displayedCount = end;
    isLoading = false;
    
    if (displayedCount >= filteredProducts.length) {
      document.getElementById('loadMore').style.display = 'none';
    } else {
      document.getElementById('loadMore').style.display = 'block';
    }
  }, 50);
}

// ===== Create Card =====
function createCard(p) {
  const card = document.createElement('div');
  card.className = 'product-card';
  
  let imgHtml = p.img
    ? `<img src="${p.img}" alt="${p.sku}" loading="lazy">`
    : `<div class="placeholder-icon">📱</div><div class="placeholder-text">产品图待补</div>`;
  
  let featuredBadge = p.featured ? '<div class="featured-tag">🔥主推</div>' : '';
  let newBadge = p.isNew ? '<div class="new-tag">🆕新品</div>' : '';
  let matchBadge = p.matchSku ? '<div class="match-tag">🔗官搭</div>' : '';
  
  let typeTag = p.type === 'channel' ? '<div class="type-tag channel">渠道</div>' : '';
  
  let isPresale = p.status === '预售';
  let liked = isLiked(p.sku);
  let heartBtn = isPresale
    ? `<button class="heart-btn ${liked ? 'liked' : ''}" data-sku="${p.sku}">
         <span class="heart-icon">${liked ? '❤️' : '🤍'}</span>
       </button>`
    : '';
  let heartCountBadge = isPresale && liked
    ? `<div class="heart-count">已关注</div>`
    : (isPresale ? `<div class="heart-count">感兴趣点❤</div>` : '');

  let colorDots = p.colors.map(c =>
    `<span class="color-dot" style="background:${c.hex === 'transparent' ? 'transparent' : c.hex};${c.hex === 'transparent' ? 'border:1px solid #ccc' : ''}"></span>`
  ).join('');
  
  card.innerHTML = `
    <div class="card-img">
      ${imgHtml}
      <div class="series-tag">${p.series}</div>
      ${typeTag}
      ${heartBtn}
      ${featuredBadge}
      ${newBadge}
      ${matchBadge}
      ${heartCountBadge}
    </div>
    <div class="card-body">
      <div class="card-sku">${p.sku}</div>
      <div class="card-price"><span class="currency">¥</span>${p.price}</div>
      <div class="card-model">${p.model}</div>
      <div class="card-subcat">${p.subCategory}</div>
      ${p.isNew && p.launchDate ? `<div class="card-launch">🆕 上新: ${p.launchDate}</div>` : ''}
      ${colorDots ? `<div class="card-colors">${colorDots}</div>` : ''}
      <div class="card-sellpoint">${p.sellPoint}</div>
    </div>
  `;
  
  // Heart button click handler
  const heartBtnEl = card.querySelector('.heart-btn');
  if (heartBtnEl) {
    heartBtnEl.addEventListener('click', function(e) {
      e.stopPropagation();
      const sku = this.getAttribute('data-sku');
      const nowLiked = toggleHeart(sku);
      this.classList.toggle('liked', nowLiked);
      const icon = this.querySelector('.heart-icon');
      if (icon) {
        icon.textContent = nowLiked ? '❤️' : '🤍';
      }
      // Update heart count badge
      const badge = card.querySelector('.heart-count');
      if (badge) {
        badge.textContent = nowLiked ? '已关注' : '感兴趣点❤';
      }
      // Update modal heart if open
      updateModalHeart(sku, nowLiked);
    });
  }

  card.onclick = () => openModal(p);
  return card;
}

// ===== Modal =====
function openModal(p) {
  const modalContent = document.getElementById('modalContent');
  
  let imgHtml = p.img
    ? `<img src="${p.img}" alt="${p.sku}">`
    : `<div class="placeholder-icon">📱</div><div class="placeholder-text">产品图待补充</div>`;
  
  let featuredBadge = p.featured ? '<div class="modal-featured">🔥 主推款</div>' : '';
  let newBadge = p.isNew ? '<div class="modal-new">🆕 新品上架</div>' : '';
  
  let colorHtml = p.colors.length
    ? `<div class="modal-colors">${p.colors.map(c =>
        `<span class="color-item"><span class="color-dot" style="background:${c.hex === 'transparent' ? 'transparent' : c.hex};${c.hex === 'transparent' ? 'border:1px solid #ccc' : ''}"></span>${c.name}</span>`
      ).join('')}</div>`
    : '—';
  
  // Modal heart button for pre-sale products
  let modalIsPresale = p.status === '预售';
  let modalLiked = isLiked(p.sku);
  let modalHeartBtn = modalIsPresale
    ? `<button class="modal-heart-btn ${modalLiked ? 'liked' : ''}" data-sku="${p.sku}">
         <span class="heart-icon">${modalLiked ? '❤️' : '🤍'}</span>
       </button>`
    : '';
  let modalHeartInfo = modalIsPresale
    ? `<div class="modal-heart-info">
         ${modalLiked ? '❤️ 已关注' : '🤍 点击表示感兴趣'}
       </div>`
    : '';

  let modalTypeTag = p.type === 'channel'
    ? `<span class="type-tag channel" style="padding:4px 10px;font-size:12px;">渠道 · ${p.series}</span>`
    : `<span class="type-tag self" style="padding:4px 10px;font-size:12px;">${p.series}</span>`;

  // Pre-compute match section HTML
  let matchHtml = '';
  if (p.matchSku) {
    var matched = PRODUCTS_DATA.find(x => x.sku === p.matchSku);
    if (matched) {
      var matchThumb = matched.img
        ? '<img src="' + matched.img + '" alt="' + matched.sku + '">'
        : '<div class="placeholder-icon">📱</div>';
      matchHtml = '<div class="modal-match">' +
        '<div class="modal-match-title">🔗 官方搭配</div>' +
        '<div class="modal-match-card" data-match-sku="' + matched.sku + '">' +
          '<div class="modal-match-thumb">' + matchThumb + '</div>' +
          '<div class="modal-match-info">' +
            '<div class="modal-match-sku">' + matched.sku + '</div>' +
            '<div class="modal-match-name">' + matched.name + '</div>' +
            '<div class="modal-match-price">¥' + matched.price + '</div>' +
          '</div>' +
          '<div class="modal-match-arrow">›</div>' +
        '</div>' +
      '</div>';
    }
  }

  modalContent.innerHTML = `
    <div class="modal-img">
      ${imgHtml}
      <div class="modal-tags">
        ${modalTypeTag}
        <span class="type-tag self" style="padding:4px 10px;font-size:12px;background:rgba(26,127,55,0.85);">${p.status}</span>
      </div>
      ${modalHeartBtn}
      ${modalHeartInfo}
      ${featuredBadge}
      ${newBadge}
    </div>
    <div class="modal-body">
      <div class="modal-sku">${p.sku}</div>
      <div class="modal-name">${p.name}</div>
      <div class="modal-price"><span class="currency">¥</span>${p.price}</div>
      <div class="modal-info">
        <div class="modal-info-row">
          <div class="modal-info-label">适配型号</div>
          <div class="modal-info-value"><strong>${p.model}</strong></div>
        </div>
        <div class="modal-info-row">
          <div class="modal-info-label">手机品牌</div>
          <div class="modal-info-value">${p.phoneBrand}</div>
        </div>
        <div class="modal-info-row">
          <div class="modal-info-label">产品分类</div>
          <div class="modal-info-value">${p.category} · ${p.subCategory}</div>
        </div>
        <div class="modal-info-row">
          <div class="modal-info-label">产品系列</div>
          <div class="modal-info-value">${p.series}${p.subStyle ? ' · ' + p.subStyle : ''}</div>
        </div>
        <div class="modal-info-row">
          <div class="modal-info-label">颜色</div>
          <div class="modal-info-value">${colorHtml}</div>
        </div>
        <div class="modal-info-row">
          <div class="modal-info-label">材质工艺</div>
          <div class="modal-info-value">${p.material}</div>
        </div>
        <div class="modal-info-row">
          <div class="modal-info-label">上新日期</div>
          <div class="modal-info-value">${p.launchDate || '—'}</div>
        </div>
      </div>
      <div class="modal-sellpoint">
        <div class="label">⭐ 产品卖点</div>
        <div class="text">${p.sellPoint}</div>
      </div>
      <div class="modal-display">
        <div class="label">📍 陈列建议</div>
        <div class="text">${p.display}</div>
      </div>
      ${matchHtml}
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';

  // Match card click handler
  const matchCard = document.querySelector('.modal-match-card');
  if (matchCard) {
    matchCard.addEventListener('click', function(e) {
      e.stopPropagation();
      const matchSku = this.getAttribute('data-match-sku');
      const matched = PRODUCTS_DATA.find(x => x.sku === matchSku);
      if (matched) {
        document.getElementById('modalOverlay').classList.remove('show');
        document.body.style.overflow = '';
        setTimeout(() => openModal(matched), 200);
      }
    });
  }

  // Modal heart button click handler
  const mHeartBtn = document.querySelector('.modal-heart-btn');
  if (mHeartBtn) {
    mHeartBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const sku = this.getAttribute('data-sku');
      const nowLiked = toggleHeart(sku);
      this.classList.toggle('liked', nowLiked);
      const icon = this.querySelector('.heart-icon');
      if (icon) {
        icon.textContent = nowLiked ? '❤️' : '🤍';
      }
      // Update heart info text
      const info = document.querySelector('.modal-heart-info');
      if (info) {
        info.textContent = nowLiked ? '❤️ 已关注' : '🤍 点击表示感兴趣';
      }
      // Update card heart in grid
      updateCardHeart(sku, nowLiked);
    });
  }
}

function updateModalHeart(sku, liked) {
  const modalHeartBtn = document.querySelector('.modal-heart-btn');
  if (modalHeartBtn && modalHeartBtn.getAttribute('data-sku') === sku) {
    modalHeartBtn.classList.toggle('liked', liked);
    const icon = modalHeartBtn.querySelector('.heart-icon');
    if (icon) {
      icon.textContent = liked ? '❤️' : '🤍';
    }
    const info = document.querySelector('.modal-heart-info');
    if (info) {
      info.textContent = liked ? '❤️ 已关注' : '🤍 点击表示感兴趣';
    }
  }
}

function updateCardHeart(sku, liked) {
  const cardBtns = document.querySelectorAll('.heart-btn[data-sku="' + sku + '"]');
  cardBtns.forEach(btn => {
    btn.classList.toggle('liked', liked);
    const icon = btn.querySelector('.heart-icon');
    if (icon) {
      icon.textContent = liked ? '❤️' : '🤍';
    }
  });
  // Update badges
  const cards = document.querySelectorAll('.product-card');
  cards.forEach(card => {
    const skuEl = card.querySelector('.card-sku');
    if (skuEl && skuEl.textContent === sku) {
      const badge = card.querySelector('.heart-count');
      if (badge) {
        badge.textContent = liked ? '已关注' : '感兴趣点❤';
      }
    }
  });
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== Search =====
let searchTimer = null;
document.getElementById('searchInput').addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = e.target.value.trim();
    applyFilters();
  }, 300);
});

// ===== Status Filter =====
document.getElementById('statusFilter').addEventListener('click', function(e) {
  let tab = e.target.closest('.status-tab');
  if (!tab) return;
  document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentStatus = tab.dataset.status;
  
  // Mark this status as seen (remove the NEW badge)
  let currentCount = 0;
  if (currentStatus === 'all') {
    currentCount = allProducts.filter(p => p.category === currentCategory).length;
  } else if (currentStatus === 'featured') {
    currentCount = allProducts.filter(p => p.category === currentCategory && p.featured).length;
  } else if (currentStatus === '新品') {
    currentCount = allProducts.filter(p => p.isNew).length;
  } else {
    currentCount = allProducts.filter(p => p.category === currentCategory && p.status === currentStatus).length;
  }
  const badgeKey = currentStatus === '新品' ? 'all:新品' : currentCategory + ':' + currentStatus;
  markStatusAsSeen(badgeKey, currentCount);
  
  // Remove badge from clicked tab immediately
  const badge = tab.querySelector('.update-badge');
  if (badge) badge.remove();
  
  // 切换到新品状态时重新渲染品牌和系列筛选（跨品类）
  if (currentStatus === '新品') {
    renderBrandTabs();
    renderSeriesFilter();
  }
  updateHeaderCount();
  applyFilters();
});

// ===== Infinite Scroll =====
function setupInfiniteScroll() {
  window.addEventListener('scroll', function() {
    if (isLoading) return;
    if (displayedCount >= filteredProducts.length) return;
    
    const scrollTop = window.scrollY;
    const windowHeight = window.innerHeight;
    const docHeight = document.body.offsetHeight;
    
    if (scrollTop + windowHeight > docHeight - 200) {
      loadMore();
    }
  });
}

// ===== Update Header Count =====
function updateHeaderCount() {
  if (currentStatus === '新品') {
    document.getElementById('headerCount').textContent = `共 ${filteredProducts.length} 款新品`;
  } else {
    const catCount = allProducts.filter(p => p.category === currentCategory).length;
    document.getElementById('headerCount').textContent = `共 ${catCount} 款`;
  }
}

// ===== Update Status Tab Counts =====
function updateStatusCounts() {
  const catProducts = allProducts.filter(p => p.category === currentCategory);
  const allNewCount = allProducts.filter(p => p.isNew).length;
  const counts = {
    all: catProducts.length,
    featured: catProducts.filter(p => p.featured).length,
    '新品': allNewCount,
    '预售': catProducts.filter(p => p.status === '预售').length,
    '在售': catProducts.filter(p => p.status === '在售').length,
    '清仓': catProducts.filter(p => p.status === '清仓').length
  };
  document.querySelectorAll('.status-tab').forEach(tab => {
    const s = tab.dataset.status;
    const c = counts[s] || 0;
    const label = tab.textContent.replace(/\s*\(\d+\)/, '').replace(/NEW/g, '').trim();
    // 新品用全局key，其他用品类+状态key
    const badgeKey = s === '新品' ? 'all:新品' : currentCategory + ':' + s;
    const showBadge = hasUpdates(badgeKey, c) && s !== 'all' && s !== '在售';
    const badgeHtml = showBadge ? '<span class="update-badge">NEW</span>' : '';
    tab.innerHTML = `${label} (${c})${badgeHtml}`;
  });
}

// ===== Price Filter =====
function setupPriceFilter() {
  document.getElementById('priceFilter').addEventListener('click', function(e) {
    let tab = e.target.closest('.price-tab');
    if (!tab) return;
    document.querySelectorAll('.price-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentPrice = tab.dataset.price;
    applyFilters();
  });
}

// ===== Category Switch =====
function setupCategorySwitch() {
  document.getElementById('categoryBar').addEventListener('click', function(e) {
    let tab = e.target.closest('.category-tab');
    if (!tab) return;
    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    currentBrand = 'all';
    currentSeries = 'all';
    currentStatus = 'all';
    currentPrice = 'all';
    document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.status-tab[data-status="all"]').classList.add('active');
    document.querySelectorAll('.price-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.price-tab[data-price="all"]').classList.add('active');
    renderBrandTabs();
    renderSeriesFilter();
    updateStatusCounts();
    updateHeaderCount();
    applyFilters();
  });
}

// ===== Update Category Counts =====
function updateCategoryCounts() {
  const cats = ['手机壳', '手机支架', '手机挂链'];
  cats.forEach(cat => {
    const count = allProducts.filter(p => p.category === cat).length;
    const el = document.getElementById('catCount-' + cat);
    if (el) el.textContent = count + '款';
  });
}

// ===== Start =====
init();
</script>
